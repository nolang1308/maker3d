# MAKER3D - 서버(AWS Lightsail, Ubuntu) 전용 compose
#
# 실행 위치 : /srv/maker3d/repo/deploy
# 실행 명령 : docker compose up -d --build
# 변수      : 같은 폴더의 .env (데이터 경로, 주소, 빌드 값)
#             env/web.env, env/api.env (비밀값. git 에 올리지 않음)
#             → 예시는 .env.example, env/*.env.example
#
# 구성
#   caddy : 입구. 80/443 을 받아 프론트·백엔드로 나눠 보내고 HTTPS 인증서를 자동 발급
#   web   : 프론트엔드 (Next.js)
#   api   : 백엔드 (Express + PrusaSlicer). 올라온 파일은 ${DATA_DIR}/api 에 저장

name: maker3d

services:

  # ───────────── 입구 (리버스 프록시 + HTTPS) ─────────────
  caddy:
    image: caddy:2.10-alpine
    container_name: maker3d-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      WEB_SITE: ${WEB_SITE:?deploy/.env 에 WEB_SITE 가 없습니다}
      API_SITE: ${API_SITE:?deploy/.env 에 API_SITE 가 없습니다}
      # www 없는 주소(maker3d.kr)를 사이트 주소로 넘길 때 씁니다. 비워 두면 쓰지 않는 포트.
      APEX_SITE: ${APEX_SITE:-:8081}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # 도메인이 이 서버를 가리키기 전 리허설 때만 "tls internal". 평소에는 빈 값.
      REHEARSAL_TLS: ${REHEARSAL_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/sites:ro
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
    depends_on:
      - web
      - api

  # ───────────── 프론트엔드 (Next.js) ─────────────
  web:
    build:
      context: ..
      args:
        # 화면 코드에 박히는 값. 바꾸면 반드시 다시 빌드(--build)해야 반영됩니다.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?deploy/.env 에 NEXT_PUBLIC_SITE_URL 이 없습니다}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?deploy/.env 에 NEXT_PUBLIC_BACKEND_URL 이 없습니다}
        NEXT_PUBLIC_NAVER_PAY_CLIENT_ID: ${NEXT_PUBLIC_NAVER_PAY_CLIENT_ID:-}
        NEXT_PUBLIC_NAVER_PAY_CHAIN_ID: ${NEXT_PUBLIC_NAVER_PAY_CHAIN_ID:-}
    image: maker3d-web:local
    container_name: maker3d-web
    restart: unless-stopped
    env_file: ./env/web.env
    environment:
      # 프론트 서버가 백엔드를 부를 때는 서버 안쪽 주소를 씁니다.
      BACKEND_URL: http://api:10000
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  # ───────────── 백엔드 (Express + PrusaSlicer) ─────────────
  api:
    build: ../backend
    image: maker3d-api:local
    container_name: maker3d-api
    restart: unless-stopped
    env_file: ./env/api.env
    environment:
      # 견적 계산 제한 시간(밀리초). 서버 CPU 는 데스크탑보다 느려서 큰 모델에 여유를 줍니다.
      SLICE_TIMEOUT_MS: ${SLICE_TIMEOUT_MS:-180000}
      # 견적을 계산하는 슬라이서: orca(오르카, Prusa XL 기준) 또는 prusa(예전 방식).
      # .env 에서 바꾼 뒤  docker compose up -d api  (다시 빌드할 필요 없음)
      QUOTE_SLICER: ${QUOTE_SLICER:-prusa}
    # 프로그램 영역은 읽기 전용. 쓸 수 있는 곳은 올라온 파일 폴더와 /tmp 뿐입니다.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${DATA_DIR}/api:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/healthz').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
